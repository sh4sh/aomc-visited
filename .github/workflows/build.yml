name: Build

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.check.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE" ]] || [[ "$BASE" =~ ^0+$ ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qvE '(\.md$|^docs/|^\.gitignore$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: aomc-visited
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Release a new version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          if ! gh release view "v$version" >/dev/null 2>&1; then
            gh release create "v$version" "build/libs/aomc-visited-$version.jar" \
              --target "$GITHUB_SHA" --title "$version" --generate-notes
          fi
